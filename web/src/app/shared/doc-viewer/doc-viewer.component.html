<div class="doc-viewer">
  <div class="doc-header">
    <h3 class="doc-title">{{ title() }}</h3>
    <span class="spacer"></span>
    <div class="doc-actions">
      @if (showZoom()) {
        <div class="zoom-controls">
          <button class="zoom-btn" (click)="zoomOut()" [disabled]="!canDecrease()"
                  matTooltip="缩小" aria-label="decrease font size">−</button>
          <span class="zoom-label">{{ zoom() }}%</span>
          <button class="zoom-btn" (click)="zoomIn()" [disabled]="!canIncrease()"
                  matTooltip="放大" aria-label="increase font size">+</button>
        </div>
      }
      @if (editable() && !editing()) {
        <button class="icon-btn" (click)="startEdit()" matTooltip="编辑" aria-label="edit">
          <mat-icon>edit</mat-icon>
        </button>
      }
    </div>
  </div>

  <div class="doc-card" [style.font-size.px]="fontSize()">
    @if (editing()) {
      <textarea class="doc-editor" [(ngModel)]="draft" rows="10"></textarea>
      <div class="doc-edit-actions">
        <button mat-button (click)="cancelEdit()">取消</button>
        <button mat-raised-button color="primary" (click)="saveEdit()">保存</button>
      </div>
    } @else {
      <p class="doc-text">{{ content() || '暂无内容' }}</p>
    }
  </div>
</div>
