# Your Interview — 全栈容器编排
#
#   一键起全套(数据库 + 消息队列 + 7 个微服务 + 网关):
#     docker compose up -d --build
#
#   看状态 / 日志:
#     docker compose ps
#     docker compose logs -f gateway
#
#   停:
#     docker compose down          停(数据保留)
#     docker compose down -v       停并清空数据
#
# 前端不在容器里 —— 用 `cd web && npm start` 在宿主机跑(开发时热重载更顺手,
# 也省内存)。前端通过 localhost:5200 访问网关,已在 web/proxy.conf.json 配好。
#
# 服务之间用 docker 内部 DNS(服务名当主机名),不经过宿主机端口。
# 只有网关把 5200 映射出来给前端用。

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  # 容器内没有 ICU,关掉 globalization；连库走 docker DNS（主机名 postgres）
  ConnectionStrings__Identity: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=identity"
  ConnectionStrings__Jobs: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=jobs"
  ConnectionStrings__InterviewsDb: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=interviews"
  ConnectionStrings__KnowledgeDb: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=knowledge"
  ConnectionStrings__AssessmentDb: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=assessment"
  ConnectionStrings__AnalyticsDb: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=analytics"
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__Username: guest
  RabbitMq__Password: guest
  # JWT 签名密钥: 从 .env 注入（已在 .gitignore）。六个服务必须用同一个值,
  # 否则 Identity 签的令牌其它服务验不过。
  Jwt__SigningKey: "${JWT_SIGNING_KEY:-}"
  # ★ 票241 双轨期:Logto 发行方(空 = 单轨旧口径)。配上后各服务同时接受
  # 旧 Identity 与 Logto 两个发行方;Logto__Audience 配成 Console 里建的
  # API resource identifier,未配时双轨期 audience 不校验(上线清单要求配上)。
  Logto__Issuer: "${LOGTO_ISSUER:-}"
  Logto__Audience: "${LOGTO_AUDIENCE:-}"
  # 票241 收敛开关:灰度期 false(双 scheme 并存);收敛日置 true(选择器只走 Logto,
  # 旧 token 一律 401)。回滚时翻回 false 并重启各服务。
  Logto__RejectOldIssuer: "${LOGTO_REJECT_OLD_ISSUER:-false}"

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile.service

# ★ 票93(B4):依赖等待必须包含数据库。此前只等 rabbitmq —— 消息队列起来了、
#   库还没就绪时,服务会带着连不上库的状态被判定可用,正是"页面能开但 API 全 500"
#   这类假成功的来源之一。
x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

# 服务自身的健康检查(容器内 8080 是 ASPNETCORE_URLS 指定的端口)
x-service-health: &service-health
  test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  # ★ 票93(B4):数据库纳入编排。
  #   此前 compose 头注释号称"一键起全套(数据库 + 消息队列 + …)",但库其实**不在**
  #   compose 里 —— 连库走 host.docker.internal(宿主机 PG)。结果是"一条命令起不来
  #   全套":宿主机没起 PG 就全盘 500,而报错根本指不到库上。
  #   现在把 PG 也纳入编排,并**把 5432 发布到宿主**:这样既保持各服务现有连接串
  #   (host.docker.internal:5432)一字不改(宿主机进程模式仍可用),又让 compose
  #   真正自包含。
  #   ⚠️ 前置:宿主 5432 端口需空闲。若本机已有 PG 在用,改这里的端口映射即可。
  postgres:
    image: postgres:16-alpine
    container_name: yourinterview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD_LOCAL:-postgres}
      POSTGRES_DB: yourinterview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ★ 票241:Logto 自有库(只在数据卷首次初始化时执行;已有 pgdata 的
      # 旧卷需手动补一次 CREATE DATABASE logto,见 docs/logto/SETUP.md)。
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 容器里没有 pg_isready 之外的依赖,直接探;必须等它 healthy 其它服务才起
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d yourinterview"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: yourinterview-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"        # 管理界面 http://localhost:15672 (guest/guest)
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  identity:
    build:
      <<: *service-build
      args: { SERVICE: Services.Identity }
    container_name: yourinterview-identity
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
      # 管理员密码只在 Identity 播种时用一次,从 .env 注入
      Seed__AdminPassword: "${ADMIN_PASSWORD:-}"
      # 演示数据密码; 留空则跳过演示数据播种
      Seed__DemoPassword: "${DEMO_PASSWORD:-}"
      # ★ 票241:Logto 审批门(只 Identity 需要;容器内 Logto 服务名直连)。
      # 凭据来自 .env,compose 文件里只留空占位,真实值绝不进库。
      Logto__Management__Endpoint: "${LOGTO_MANAGEMENT_ENDPOINT:-http://logto:3001}"
      Logto__Management__M2mClientId: "${LOGTO_M2M_CLIENT_ID:-}"
      Logto__Management__M2mClientSecret: "${LOGTO_M2M_CLIENT_SECRET:-}"
      Logto__Management__WebhookSigningKey: "${LOGTO_WEBHOOK_SIGNING_KEY:-}"
      # ★ 票252(B8-A):Logto 每 hook 一把签名 key,单 key 只够一个 hook;四个 hook
      # 须用索引形列表,列全各 hook 的 key(列表非空时全量取代上行单 key,漏列的
      # hook 会 401;空项自动忽略)。填法:.env 里写 LOGTO_WEBHOOK_SIGNING_KEY_0/_1/_2/_3。
      Logto__Management__WebhookSigningKeys__0: "${LOGTO_WEBHOOK_SIGNING_KEY_0:-}"
      Logto__Management__WebhookSigningKeys__1: "${LOGTO_WEBHOOK_SIGNING_KEY_1:-}"
      Logto__Management__WebhookSigningKeys__2: "${LOGTO_WEBHOOK_SIGNING_KEY_2:-}"
      Logto__Management__WebhookSigningKeys__3: "${LOGTO_WEBHOOK_SIGNING_KEY_3:-}"
      Logto__Management__GateLaunchedAt: "${LOGTO_GATE_LAUNCHED_AT:-}"
      # 票241 旧 Identity 发行开关(Auth 节):灰度开始时 LegacyRegistrationEnabled=false
      # (旧 POST /api/auth/register 服务端 410);收敛日 IssuanceEnabled=false
      # (旧登录/刷新 410,停发);收敛后回滚时把 IssuanceEnabled 翻回 true 并重启 Identity。
      Auth__LegacyRegistrationEnabled: "${LEGACY_REGISTRATION_ENABLED:-true}"
      Auth__IssuanceEnabled: "${AUTH_ISSUANCE_ENABLED:-true}"
    depends_on: *service-deps
    healthcheck: *service-health

    extra_hosts:
      - "host.docker.internal:host-gateway"
  jobs:
    build:
      <<: *service-build
      args: { SERVICE: Services.Jobs }
    container_name: yourinterview-jobs
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
      # AiGateway 走 Docker 内部 DNS(jobs 容器内 127.0.0.1 不是宿主机)
      AiGateway__BaseUrl: "http://aigateway:8080/"
      # 2026-10-19:LinkedIn 登录态(宿主机 ~/.your-interview/linkedin-profile/state.json)
      LinkedIn__ProfileDir: /root/.your-interview/linkedin-profile
    volumes:
      # 2026-10-19:挂载 LinkedIn 会话，Auto-fetch 用（需读写，后端会回写登录态）
      - ~/.your-interview:/root/.your-interview
    depends_on: *service-deps
    healthcheck: *service-health

    extra_hosts:
      - "host.docker.internal:host-gateway"
  interviews:
    build:
      <<: *service-build
      args: { SERVICE: Services.Interviews }
    container_name: yourinterview-interviews
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
      # ★ 2026-09-24(M1):面试录音落盘目录。与 analysis-worker 挂同一个卷 ——
      #   interviews 上传写盘,Worker 从同一位置读文件跑转写/分析。
      #   数据库只存相对路径,两个服务各自锚定自己的根(容器内路径一致即可)。
      INTERVIEW_STORAGE_DIR: /app/storage/interviews
      # ★ 票 240：邮箱直连导入 OAuth（空 = 未配置，连接端点会明确报错；
      #   真实值由部署方填环境变量，绝不进 git；RedirectUri 须与云端登记一字一致）。
      Mailbox__Google__ClientId: "${MAILBOX_GOOGLE_CLIENT_ID:-}"
      Mailbox__Google__ClientSecret: "${MAILBOX_GOOGLE_CLIENT_SECRET:-}"
      Mailbox__Google__RedirectUri: "${MAILBOX_GOOGLE_REDIRECT_URI:-}"
      Mailbox__Microsoft__ClientId: "${MAILBOX_MICROSOFT_CLIENT_ID:-}"
      Mailbox__Microsoft__ClientSecret: "${MAILBOX_MICROSOFT_CLIENT_SECRET:-}"
      Mailbox__Microsoft__RedirectUri: "${MAILBOX_MICROSOFT_REDIRECT_URI:-}"
      Mailbox__FrontendBaseUrl: "${MAILBOX_FRONTEND_BASE_URL:-http://localhost:4200}"
    volumes:
      - interview-recordings:/app/storage/interviews
    depends_on: *service-deps
    healthcheck: *service-health

    extra_hosts:
      - "host.docker.internal:host-gateway"
  knowledge:
    build:
      <<: *service-build
      args: { SERVICE: Services.Knowledge }
    container_name: yourinterview-knowledge
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
    depends_on: *service-deps
    healthcheck: *service-health

    extra_hosts:
      - "host.docker.internal:host-gateway"
  assessment:
    build:
      <<: *service-build
      args: { SERVICE: Services.Assessment }
    container_name: yourinterview-assessment
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
      # ★ 2026-09-27(Forrest 明确要求):**录音必须落在 Mac 本机**,不能只存在
      #   Docker 数据卷里(数据卷在宿主机上看不见、也摸不着)。
      #   ★ 2026-09-27 晚(Forrest 再次明确要求):录音**不能放在仓库里面** ——
      #     放在仓库里迟早有一天会被误提交到 GitHub,是灾难。
      #   所以这里 bind mount 的是**仓库的同级目录** `../recordings`
      #     (仓库在 ~/dev/your-interview,录音就在 ~/dev/recordings),
      #   完全脱离 git 仓库,Finder 里直接可见。
      #   挂载点是 **整个 `../recordings`**(抬到上一层),而不是某服务的子目录 ——
      #   这样每个服务在自己的子目录里落地:assessment 的录音在
      #     `~/dev/recordings/assessment/`、以后 interviews 的视频在
      #     `~/dev/recordings/interviews/` …,互不串、互不覆盖。
      #   本服务只认 `assessment` 这个子目录(见 PRACTICE_STORAGE_DIR)。
      # ★★ 2026-09-27(根因修复):必须走**配置项**而不是环境变量 ★★
      #   IAudioStore.ResolveRoot 的优先级在所有代码版本里都是:
      #     ① Storage:RootDirectory(配置)  ② PRACTICE_STORAGE_DIR(环境变量)  ③ 兜底目录
      #   过去只设了 ② —— 而 Mac 上长期跑的是**旧镜像**(镜像自 09-22 起没真正重建过),
      #   旧代码不认 ②,于是走了 ③ 兜底,把录音写到容器内部的意外路径
      #   (实测落在 /Users/jadenfly/dev/your-interview/1ac878bc/2026/09/,宿主机根本看不到)。
      #   改成 ① 之后:**无论镜像新旧**,根目录都被强制钉死在 /app/storage/assessment,
      #   也就是宿主机的 ~/dev/recordings/assessment —— 不会再错位。
      Storage__RootDirectory: /app/storage/assessment
      # 保留环境变量,兼容读环境变量的老代码路径(双保险)
      PRACTICE_STORAGE_DIR: /app/storage/assessment
      # ★ 2026-09-27(Forrest:本机存储路径可在"我的账户"里自选):
      #   容器里只认 /app/storage/assessment,**本机那一侧的目录**用户是看不到的 ——
      #   这里把它作为字符串透传进来,设置页才能如实回显"录音现在存在本机的哪个文件夹"。
      #   换位置只改这一处的 RECORDINGS_HOST_DIR(写在 .env 里),下面挂载点会同步跟着变。
      Storage__HostDirectory: ${RECORDINGS_HOST_DIR:-../recordings}
      # 宿主机家目录:让用户在界面里选 "~/Documents/…" 这类路径时,
      # 容器能把它还原成 Mac 上的真实路径(否则 ~ 会变成容器自己的 /root)
      HOST_HOME: ${HOME:-}
    volumes:
      # 想换成"文稿"目录:在 .env 里写
      #   RECORDINGS_HOST_DIR=/Users/你的用户名/Documents/your-interview/recordings
      # 然后 docker compose up -d assessment(容器会带着新挂载重建)。
      - ${RECORDINGS_HOST_DIR:-../recordings}:/app/storage
    depends_on: *service-deps
    healthcheck: *service-health

    extra_hosts:
      - "host.docker.internal:host-gateway"
  analytics:
    build:
      <<: *service-build
      args: { SERVICE: Services.Analytics }
    container_name: yourinterview-analytics
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
    depends_on: *service-deps
    healthcheck: *service-health

  # AI 网关(2026-09-18):LLM 凭据保管 + 通用补全转发。
  # 独立成服务让凭据只存一处 —— Jobs(Cover Letter)/Interviews(准备包)/
  # Knowledge 都通过它调 LLM,不再各自解析凭据。
    extra_hosts:
      - "host.docker.internal:host-gateway"

  aigateway:
    build:
      <<: *service-build
      args: { SERVICE: Services.AiGateway }
    container_name: yourinterview-aigateway
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
      # schema 是 aigateway,与宿主机进程共用同一库
      ConnectionStrings__AiGatewayDb: "Host=host.docker.internal;Port=5432;Database=yourinterview;Username=postgres;Password=${PGPASSWORD_LOCAL};Search Path=aigateway"
    depends_on: *service-deps
    healthcheck: *service-health

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 共享 OCR 服务(2026-10-21,票59):PaddleOCR PP-OCRv6 本地识别,平台能力
  # (定稿 replica/platform-ocr-spec.md)—— Playbook 入口先行接入,其余模块
  # 经网关 /api/ocr/** 共用同一服务,禁止各模块自攒 OCR。无状态、无 DB 依赖;
  # 配置全走 env(OCR_*),mkldnn 默认关(paddlepaddle 3.3.1 OneDNN bug 绕行)。
  ocr-service:
    build:
      context: ./src/ocr-service
      dockerfile: Dockerfile
    container_name: yourinterview-ocr
    restart: unless-stopped
    environment:
      OCR_PORT: "5300"
      OCR_MIN_CONFIDENCE: "${OCR_MIN_CONFIDENCE:-0.5}"
      OCR_ENABLE_MKLDNN: "${OCR_ENABLE_MKLDNN:-false}"
      OCR_JOB_TTL_SECONDS: "${OCR_JOB_TTL_SECONDS:-600}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5300/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  gateway:
    build:
      <<: *service-build
      args: { SERVICE: Services.Gateway }
    container_name: yourinterview-gateway
    restart: unless-stopped
    environment:
      <<: *service-env
      ASPNETCORE_URLS: "http://+:8080"
      # YARP 路由表里写的是 127.0.0.1:<port>,容器内要改成服务名。
      # 下面这些覆盖在 Services.Gateway 的配置读取处生效。
      ReverseProxy__Clusters__identity__Destinations__d1__Address: "http://identity:8080/"
      ReverseProxy__Clusters__jobs__Destinations__d1__Address: "http://jobs:8080/"
      ReverseProxy__Clusters__interviews__Destinations__d1__Address: "http://interviews:8080/"
      ReverseProxy__Clusters__knowledge__Destinations__d1__Address: "http://knowledge:8080/"
      ReverseProxy__Clusters__assessment__Destinations__d1__Address: "http://assessment:8080/"
      ReverseProxy__Clusters__analytics__Destinations__d1__Address: "http://analytics:8080/"
      ReverseProxy__Clusters__aigateway__Destinations__d1__Address: "http://aigateway:8080/"
      ReverseProxy__Clusters__ocr__Destinations__d1__Address: "http://ocr-service:5300/"
    ports:
      - "5200:8080"          # 唯一对外暴露的端口,前端连它
    depends_on:
      identity:
        condition: service_healthy
      jobs:
        condition: service_healthy
      interviews:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      assessment:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck: *service-health

  # ★ 票241:Logto 会员身份源(自托管,MPL-2.0)。
  # 版本必须锁定具体号,绝不用 :latest 跑生产(升级前先在沙盒 compose 验证)。
  # 核心(3001,OIDC + sign-in experience)与 Admin Console(3002)同容器;
  # 认证流浏览器直连 Logto,不走 YARP(网关改动为零,各服务直接向 JWKS 校验)。
  # SMTP 连接器、sign-in experience、webhook、M2M 应用全部在 Console 里配,
  # 步骤见 docs/logto/SETUP.md;凭据只进 .env,绝不写进本文件。
  logto:
    image: ghcr.io/logto-io/logto:1.45.0
    container_name: yourinterview-logto
    restart: unless-stopped
    environment:
      DB_URL: "postgres://postgres:${PG_PASSWORD:-postgres}@postgres:5432/logto"
      ENDPOINT: "${LOGTO_ENDPOINT:-http://localhost:3001}"
      ADMIN_ENDPOINT: "${LOGTO_ADMIN_ENDPOINT:-http://localhost:3002}"
    ports:
      - "3001:3001"
      # 票241:Console 只绑 localhost(自托管 OSS 无协作者邀请功能,管理面 = 首次
      # onboarding 创建的唯一管理员账号;远程访问走 SSH 隧道或 VPN,绝不开公网端口)。
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  # 后台分析服务: 没有 HTTP 端点, 不需要暴露端口, 也不做 healthcheck。
  # 它消费 RabbitMQ 里的分析请求 → 调 Azure Speech 转写 → 六维诊断 → 回写 Interviews。
  #
  # 密钥来源(按优先级): 环境变量 > .env 文件 > appsettings.Development.json(本地)。
  # compose 会读仓库根的 .env(已在 .gitignore 里), 所以真实 key 不落库。
  # 首次使用: cp .env.example .env, 再把 AZURE_SPEECH_KEY 等换成真值。
    extra_hosts:
      - "host.docker.internal:host-gateway"

  analysis-worker:
    build:
      <<: *service-build
      args: { SERVICE: Analysis.Worker }
    container_name: yourinterview-analysis-worker
    restart: unless-stopped
    environment:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      # 服务地址走容器 DNS
      Services__Interviews: "http://interviews:8080"
      Services__Analytics: "http://analytics:8080"
      Services__Knowledge: "http://knowledge:8080"
      Services__Identity: "http://identity:8080"
      # 密钥从 .env 注入(漏配时为空, Worker 启动会给出明确告警/报错)
      AzureSpeech__Key: "${AZURE_SPEECH_KEY:-}"
      AzureSpeech__Region: "${AZURE_SPEECH_REGION:-canadacentral}"
      ServiceAccount__Email: "${SERVICE_ACCOUNT_EMAIL:-service.analysis@your-interview.local}"
      ServiceAccount__Password: "${SERVICE_ACCOUNT_PASSWORD:-}"
      Storage__WorkDirectory: "/app/.analysis"
      # ★ 2026-09-24(M1):面试录音的读取位置 —— 与 interviews 服务共享同一个卷。
      #   事件里带的是相对路径,Worker 用这个根把它拼成容器内绝对路径。
      INTERVIEW_STORAGE_DIR: /app/storage/interviews
    volumes:
      - analysis-work:/app/.analysis
      - interview-recordings:/app/storage/interviews
    depends_on:
      rabbitmq:
        condition: service_healthy
      interviews:
        condition: service_healthy
      identity:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"
