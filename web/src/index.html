<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your Interview</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- ★ ML-FIX-UI(L-1):启动指示 —— Slow 3G 下 JS 包下载/解析慢,Angular 接管前
       页面是空白静止。纯 HTML/CSS 指示先顶上去,Angular 启动后替换 app-root 内容,
       指示自然消失;不依赖任何 JS,与 Angular 内 loading() 进度条互补。 -->
  <style>
    .boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Inter, system-ui, sans-serif; color: #475569; }
    .boot-splash .boot-bar { width: 180px; height: 4px; border-radius: 2px; background: #e2e8f0; overflow: hidden; }
    .boot-splash .boot-bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: #2563eb; animation: boot-slide 1.2s ease-in-out infinite; }
    @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot-splash" role="status">
      <div class="boot-bar"><i></i></div>
      <p>Loading Your Interview…</p>
    </div>
  </app-root>
</body>
</html>
