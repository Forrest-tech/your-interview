<div class="login-wrap">
  <mat-card class="login-card">
    @if (busy()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }

    <mat-card-header>
      <div class="head">
        <span class="mark">▮</span>
        <div>
          <h1>Your Interview</h1>
          <p>求职与面试全流程平台</p>
        </div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="submit()" #f="ngForm">
        <mat-form-field appearance="outline" class="full">
          <mat-label>邮箱</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email"
                 autocomplete="username" required autofocus>
          <mat-icon matPrefix>mail_outline</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>密码</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'"
                 name="password" [(ngModel)]="password"
                 autocomplete="current-password" required>
          <mat-icon matPrefix>lock_outline</mat-icon>
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword.set(!hidePassword())" tabindex="-1">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (notice()) {
          <div class="info">
            <mat-icon>info_outline</mat-icon>
            <span>{{ notice() }}</span>
          </div>
        }

        @if (error()) {
          <div class="err">
            <mat-icon>error_outline</mat-icon>
            <span>{{ error() }}</span>
          </div>
        }

        <button mat-raised-button color="primary" class="full submit"
                type="submit" [disabled]="busy() || !email || !password">
          {{ busy() ? '登录中…' : '登录' }}
        </button>
      </form>

      @if (googleEnabled()) {
        <div class="divider"><span>或</span></div>

        <button mat-stroked-button class="full google-btn" type="button"
                (click)="loginWithGoogle()" [disabled]="busy() || googleBusy()">
          <svg class="g-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.02.16 3.5 2.7.24.02c2.2-2 3.5-5 3.5-8.6z"/>
            <path fill="#34A853" d="M12 24c3.2 0 5.9-1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5l-.15.01-3.6 2.8-.05.13C3.5 21.3 7.4 24 12 24z"/>
            <path fill="#FBBC05" d="M5.3 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.01-.17-3.7-2.8-.12.06A11.9 11.9 0 0 0 0 12c0 1.9.5 3.8 1.4 5.5l3.9-3.1z"/>
            <path fill="#EA4335" d="M12 4.6c2.2 0 3.7.9 4.5 1.7l3.3-3.2C17.9 1.2 15.2 0 12 0 7.4 0 3.5 2.7 1.4 6.5l3.9 3.1c.9-2.9 3.6-5 6.7-5z"/>
          </svg>
          {{ googleBusy() ? '正在建立会话…' : '使用 Google 登录' }}
        </button>
      }
    </mat-card-content>
  </mat-card>

  <p class="foot">个人使用 · 数据仅存本地</p>
</div>
