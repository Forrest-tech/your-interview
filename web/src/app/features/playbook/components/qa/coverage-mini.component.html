<mat-card class="qa-coverage-mini">
  <mat-card-header>
    <mat-icon mat-card-avatar>pie_chart</mat-icon>
    <mat-card-title>{{ t('pb.qa.coverage.title') }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (dist().length === 0) {
      <p class="muted">{{ t('pb.qa.coverage.empty') }}</p>
    } @else {
      @for (d of dist(); track d.name) {
        <div class="cov-row">
          <span class="cov-name">{{ catLabel(d.name) }}</span>
          <div class="cov-bar"><div class="fill" [style.width.%]="d.pct"></div></div>
          <span class="cov-count">{{ tn('pb.qa.coverage.count', d.count) }}</span>
        </div>
      }
    }
  </mat-card-content>
</mat-card>
