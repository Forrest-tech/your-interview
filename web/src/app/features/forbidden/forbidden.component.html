<div class="forbidden-wrap">
  <mat-card class="forbidden-card">
    <mat-card-content>
      <mat-icon class="big-icon">lock_outline</mat-icon>
      <h1>403</h1>
      <p class="msg">没有权限访问此页面</p>
      <p class="hint">如果你认为这是误判,请联系管理员为你的账号补充相应权限。</p>
      <button mat-raised-button color="primary" class="back-btn" (click)="goDashboard()">
        <mat-icon>arrow_back</mat-icon> 返回总览
      </button>
    </mat-card-content>
  </mat-card>
</div>
