<div class="doc-viewer">
  <div class="doc-header">
    <h3 class="doc-title">{{ title() }}</h3>
    <span class="spacer"></span>
    <div class="doc-actions">
      @if (showZoom()) {
        <div class="zoom-controls">
          <button class="zoom-btn" (click)="zoomOut()" [disabled]="!canDecrease()"
                  [matTooltip]="t('doc.zoomOut')" [attr.aria-label]="t('doc.zoomOut')">−</button>
          <span class="zoom-label">{{ zoom() }}%</span>
          <button class="zoom-btn" (click)="zoomIn()" [disabled]="!canIncrease()"
                  [matTooltip]="t('doc.zoomIn')" [attr.aria-label]="t('doc.zoomIn')">+</button>
        </div>
      }
      @if (editable() && !editing()) {
        <button class="icon-btn" (click)="startEdit()" [matTooltip]="t('common.edit')" [attr.aria-label]="t('common.edit')">
          <mat-icon>edit</mat-icon>
        </button>
      }
    </div>
  </div>

  <div class="doc-card" [style.font-size.px]="fontSize()">
    @if (editing()) {
      <textarea class="doc-editor" [(ngModel)]="draft" rows="10"></textarea>
      <div class="doc-edit-actions">
        <button mat-button (click)="cancelEdit()">{{ t('common.cancel') }}</button>
        <button mat-raised-button color="primary" (click)="saveEdit()">{{ t('common.save') }}</button>
      </div>
    } @else {
      <p class="doc-text">{{ content() || t('doc.empty') }}</p>
    }
  </div>
</div>
